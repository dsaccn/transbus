    <!-- Content Security Policy: restrict sources to prevent XSS -->

      content="
        default-src 'self';
        script-src 'self' 'unsafe-inline';
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;

        frame-ancestors 'none';

        base-uri 'self';
      "
    />
    <script>
      // Polyfill/shim window.fetch setter to prevent "Cannot set property fetch of #<Window> which has only a getter"
      (function() {
        try {
          var _currentFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _currentFetch;
            },
            set: function(fn) {
              _currentFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          try {
            var proto = Object.getPrototypeOf(window) || (typeof Window !== 'undefined' && Window.prototype);
            if (proto) {
              Object.defineProperty(proto, 'fetch', {
                get: function() {
                  return _currentFetch;
                },
                set: function(fn) {
                  _currentFetch = fn;
                },
                configurable: true,
                enumerable: true
              });
            }
          } catch (e2) {}
        }

        // Global safety error trap for fetch getter error
        window.addEventListener(
          'error',
          function(e) {
            if (e && e.message && e.message.indexOf('fetch') !== -1 && e.message.indexOf('getter') !== -1) {
              if (e.preventDefault) e.preventDefault();
              if (e.stopImmediatePropagation) e.stopImmediatePropagation();
              return true;
            }
          },
          true
        );
      })();
    </script>
